services:
  - type: web
    name: castora-backend-1
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    startCommand: bash start_render.sh
    healthCheckPath: /healthz
    disk:
      name: castora-runtime
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: CASTORA_RUNTIME_DIR
        value: /var/data
      # Seed the initial RSS sources when a new persistent disk is attached.
      # Without sources the feed processor has nothing to ingest, leaving the
      # Articles page empty.
      - key: CASTORA_SEED_DEFAULT_SOURCES
        value: "true"
      - key: REDIS_URL
        fromService:
          name: castora-queue
          type: keyvalue
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      - key: ELEVENSLAB_API_KEY
        sync: false
      - key: PODCAST_STUDIO_USE_REAL_TTS
        value: "true"
      # A hosted engine avoids loading the resource-heavy local Kokoro model
      # in the Render web process. Configure ELEVENSLAB_API_KEY in Render.
      - key: PODCAST_STUDIO_DEFAULT_TTS_ENGINE
        value: "elevenlabs"
      - key: PODCAST_STUDIO_TTS_FALLBACKS
        value: "false"
      - key: PODCAST_STUDIO_ALLOW_PLACEHOLDER_AUDIO
        value: "false"
      - key: PODCAST_STUDIO_USE_AI_SCRIPT
        value: "true"

  - type: keyvalue
    name: castora-queue
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction
