services:
  - type: web
    name: castora-backend-1
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt
    # The Studio sends banner approvals to Celery. Start the API and its
    # worker together; running Gunicorn alone leaves deployed audio jobs with
    # no process to execute them.
    startCommand: bash start_render.sh
    healthCheckPath: /healthz
    envVars:
      # Podcast data is backed up outside Render because Free web services
      # cannot attach disks. Set these two values from a Supabase project.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_PODCASTS_BUCKET
        value: castora-podcasts
      - key: CLOUD_PODCAST_BACKUP_REQUIRED
        value: "true"
      # Seed the initial RSS sources when the app starts.
      - key: CASTORA_SEED_DEFAULT_SOURCES
        value: "true"
      - key: REDIS_URL
        fromService:
          name: castora-queue
          type: keyvalue
          property: connectionString
      - key: GROQ_API_KEY
        sync: false
      # Enables Google web search through Serper. Without it, Castora uses
      # Google News first and only then falls back to the local RSS database.
      - key: SERPER_API_KEY
        sync: false
      # Configure at least one speech provider. A Groq key creates scripts,
      # but it cannot generate the final spoken audio file.
      - key: OPENAI_API_KEY
        sync: false
      - key: ELEVENSLAB_API_KEY
        sync: false
      # Standard spelling accepted by the audio provider. The backend also
      # supports the legacy ELEVENSLAB_API_KEY above for existing deployments.
      - key: ELEVENLABS_API_KEY
        sync: false
      # On ElevenLabs' free API plan, use IDs from voices you created in My
      # Voices / Voice Design. Voice Library IDs are rejected with HTTP 402.
      - key: ELEVENLABS_VOICE_ID_1
        sync: false
      - key: ELEVENLABS_VOICE_ID_2
        sync: false
      - key: PODCAST_STUDIO_USE_REAL_TTS
        value: "true"
      # Edge TTS needs no paid-provider credits. ElevenLabs/OpenAI remain
      # fallbacks when their keys are configured.
      - key: PODCAST_STUDIO_DEFAULT_TTS_ENGINE
        value: "edge"
      - key: PODCAST_STUDIO_TTS_FALLBACKS
        value: "true"
      - key: PODCAST_STUDIO_ALLOW_PLACEHOLDER_AUDIO
        value: "false"
      - key: PODCAST_STUDIO_USE_AI_SCRIPT
        value: "true"
      - key: PODCAST_STUDIO_FAST_SCRIPT
        value: "false"
      - key: PODCAST_AGENT_USE_CELERY
        value: "true"

  - type: keyvalue
    name: castora-queue
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction
